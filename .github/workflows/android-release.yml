name: Android Release Build

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-android:
    name: Build Android APK & Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Validate EAS authentication
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK via EAS
        id: eas_build
        run: |
          echo "Starting EAS build for tag ${{ github.ref_name }}..."
          
          # Run EAS build, wait for completion, capture output
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            2>&1 | tee build_output.txt
          
          echo "Build output saved."
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get APK download URL
        id: get_url
        run: |
          echo "Fetching latest build info..."
          
          # Get the most recent completed build URL
          APK_URL=$(eas build:list \
            --platform android \
            --status finished \
            --limit 1 \
            --json \
            --non-interactive 2>/dev/null \
            | python3 -c "
          import sys, json
          try:
            builds = json.load(sys.stdin)
            if builds:
              url = builds[0].get('artifacts', {}).get('buildUrl', '')
              print(url)
          except Exception as e:
            print('', file=sys.stderr)
          ")
          
          if [ -z "$APK_URL" ]; then
            echo "ERROR: Could not extract APK URL from EAS build list."
            cat build_output.txt
            exit 1
          fi
          
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          echo "APK URL: $APK_URL"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        run: |
          APK_URL="${{ steps.get_url.outputs.apk_url }}"
          APK_NAME="mobile-agent-${{ github.ref_name }}.apk"
          echo "Downloading APK from: $APK_URL"
          curl -fL --progress-bar "$APK_URL" -o "$APK_NAME"
          ls -lh "$APK_NAME"
          echo "apk_name=$APK_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Mobile Agent ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 📱 Mobile Agent ${{ github.ref_name }}

            A privacy-first, on-device AI agent. Runs a quantized LLM (Qwen 3.5 4B) **entirely on your Android device** — no cloud, no data leaves your phone.

            ### ✨ v1.0 Features
            - **8 Device Tools** — battery, device info, storage, network, brightness control, GPS, time
            - **Multi-conversation** — save, switch, and delete chat sessions (stored locally)
            - **Dynamic System Prompt** — agent proactively uses tools based on context
            - **Thinking Indicator** — live status while the agent is processing

            ### 📥 Installation
            1. Download `mobile-agent-${{ github.ref_name }}.apk` below
            2. On Android: **Settings → Security → Install unknown apps** → enable for your file manager
            3. Open and install the APK
            4. Launch the app → **Settings tab** → **Download Model** (~2.5 GB, one-time)

            > ⚠️ **First launch**: The AI model (~2.5 GB) must be downloaded on first use via the Settings tab. Requires Wi-Fi recommended.

            ### Requirements
            - Android 9.0+ (API 28)
            - ~3 GB free storage
            - ARM64 device (most modern Android phones)
          draft: false
          prerelease: false
          files: mobile-agent-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
